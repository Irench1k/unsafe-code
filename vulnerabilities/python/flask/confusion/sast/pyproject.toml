[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confusion-sast"
version = "0.1.0"
description = "Static analysis for confusion/inconsistent interpretation vulnerabilities in Flask apps"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "Pygments>=2.18",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist",
    "ipython>=8.0",
    "jupyterlab>=4.0",
]
notebook = [
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
    "ipycytoscape>=1.3",
    "ipydatagrid>=1.3",
    "anywidget>=0.9",
]
joern = [
    "cpgqls-client>=0.5",
]

[project.scripts]
confusion-scan = "confusion_sast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/confusion_sast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
